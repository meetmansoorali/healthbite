<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthBite</title>
    <!-- Favicon using logo.png -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #202123;
            --text-muted: #6e6e80;
            --border-color: #d9d9e3;
            --input-bg: #f4f4f5;
            --btn-bg: #202123;
            --btn-hover: #2f3037;
            --bubble-user: #f4f4f5;
            --bubble-ai: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            /* Mobile viewport height fix */
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* Top Header */
        header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* Chat Stream Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .chat-width-limiter {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Message Row Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row {
            display: flex;
            width: 100%;
            gap: 12px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 12px;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            background-color: var(--bubble-user);
            color: var(--text-main);
            border-top-right-radius: 2px;
            font-weight: 500;
        }

        .message-row.ai .message-bubble {
            background-color: var(--bubble-ai);
            color: var(--text-main);
            width: 100%;
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
        }

        .message-bubble img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        /* Bottom Input Wrapper Area */
        .input-area-wrapper {
            padding: 12px 16px 20px 16px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 30%);
            flex-shrink: 0;
        }

        .input-inner-container {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Preview Badge */
        .preview-badge {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--input-bg);
            padding: 6px 10px;
            border-radius: 6px;
            width: fit-content;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.2s ease-out;
        }

        .preview-badge img {
            width: 20px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Unified ChatGPT Input Bar */
        .chat-input-bar {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: border-color 0.2s, background-color 0.2s;
        }

        .chat-input-bar:focus-within {
            border-color: #b4b4b4;
            background-color: #ffffff;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.06);
        }

        .upload-pin {
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .upload-pin:hover {
            color: var(--text-main);
        }

        .inline-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            padding: 6px 0;
            min-width: 0;
        }

        .inline-field::placeholder {
            color: var(--text-muted);
        }

        .field-divider {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            flex-shrink: 0;
        }

        .send-arrow-btn {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .send-arrow-btn:hover {
            background-color: var(--btn-hover);
        }

        .send-arrow-btn:active {
            transform: scale(0.95);
        }

        .send-arrow-btn:disabled {
            background-color: #d9d9e3;
            cursor: not-allowed;
        }

        .footer-note {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
        }

        /* Mobile Screen Adjustments */
        @media (max-width: 480px) {
            header {
                padding: 10px 14px;
            }

            .chat-container {
                padding: 12px 10px;
            }

            .input-area-wrapper {
                padding: 10px 10px 16px 10px;
            }

            .chat-input-bar {
                padding: 6px 10px;
                border-radius: 14px;
            }

            .message-bubble {
                max-width: 92%;
                padding: 10px 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-content">
            <img src="logo.png" alt="HealthBite Logo" class="header-logo">
            <div class="header-text">
                <h1>HealthBite</h1>
            </div>
        </div>
    </header>

    <!-- Chat Messages Stream Area -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-width-limiter" id="chatLimiter">
            <div style="text-align: center; color: var(--text-muted); margin-top: 12vh; padding: 0 16px;">
                <p style="font-size: 14px; font-weight: 500; color: var(--text-main);">Enter your Disease and food
                    item below to know should you eat or avoid.</p>
            </div>
        </div>
    </div>

    <!-- Bottom Unified Input Panel -->
    <div class="input-area-wrapper">
        <div class="input-inner-container">
            <!-- Preview Badge -->
            <div class="preview-badge" id="previewBadge">
                <img id="thumbPreview" alt="Preview">
                <span id="fileNameDisplay">Image attached</span>
                <i class="fa-solid fa-xmark" onclick="clearImage()" style="cursor:pointer; margin-left: 4px;"></i>
            </div>

            <!-- Unified Bar -->
            <div class="chat-input-bar">
                <label class="upload-pin" title="Attach product label image">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;"
                        onchange="handleFileSelect(event)">
                    <i class="fa-solid fa-paperclip"></i>
                </label>

                <input type="text" id="diseaseInput" class="inline-field" placeholder="Disease"
                    onkeydown="handleKey(event)">

                <div class="field-divider"></div>

                <input type="text" id="foodInput" class="inline-field" placeholder="Food" onkeydown="handleKey(event)">

                <button class="send-arrow-btn" id="sendBtn" onclick="submitAnalysis()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>

            <div class="footer-note">
                HealthBite can make mistakes. Check important health information. </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = "AQ.Ab8RN6Io6z2IO4hyVz5vs3MZhUvEv3_i9UHpk7c9y1GGmPk-Xw";
        const MODEL_NAME = "gemini-3.6-flash";
        // ---------------------

        let base64ImageString = null;
        let isFirstMessage = true;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    base64ImageString = e.target.result.split(',')[1];
                    document.getElementById('thumbPreview').src = e.target.result;
                    document.getElementById('fileNameDisplay').innerText = file.name;
                    document.getElementById('previewBadge').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            base64ImageString = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewBadge').style.display = 'none';
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitAnalysis();
            }
        }

        async function submitAnalysis() {
            const disease = document.getElementById('diseaseInput').value.trim();
            const food = document.getElementById('foodInput').value.trim();
            const sendBtn = document.getElementById('sendBtn');

            if (!disease) {
                alert("Please enter a disease or condition.");
                document.getElementById('diseaseInput').focus();
                return;
            }

            if (!food && !base64ImageString) {
                alert("Please enter a food item or attach an image.");
                document.getElementById('foodInput').focus();
                return;
            }

            if (isFirstMessage) {
                document.getElementById('chatLimiter').innerHTML = '';
                isFirstMessage = false;
            }

            const chatLimiter = document.getElementById('chatLimiter');
            const currentImage = base64ImageString;

            let userHtml = `
                <div class="message-row user">
                    <div class="message-bubble">
                        <div>${escapeHtml(disease)} + ${food ? escapeHtml(food) : 'Product Label'}</div>`;
            if (currentImage) {
                userHtml += `<img src="data:image/jpeg;base64,${currentImage}" alt="Uploaded Label">`;
            }
            userHtml += `</div></div>`;
            chatLimiter.insertAdjacentHTML('beforeend', userHtml);

            document.getElementById('foodInput').value = '';
            clearImage();
            scrollToBottom();

            const aiMsgId = 'ai-msg-' + Date.now();
            let loadingHtml = `
                <div class="message-row ai" id="${aiMsgId}">
                    <div class="message-bubble" style="color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin"></i> Checking ...
                    </div>
                </div>`;
            chatLimiter.insertAdjacentHTML('beforeend', loadingHtml);
            scrollToBottom();
            sendBtn.disabled = true;

            try {
                let promptText = `Analyze safety for:
Condition: ${disease}
Item: ${food ? food : 'Provided image'}

Provide a short, direct, point-to-point response using exact headings with bold formatting:
**Verdict:** [Eat / Do Not Eat / Caution]
**Portion:** [Safe quantity limit]
**Reason:** [One brief sentence]
**Pros:** [Short bullet point benefits]
**Cons & Risks:** [Short bullet point risks]
**Suggestion:** [One brief recommendation]`;

                let partsArray = [{ text: promptText }];
                if (currentImage) {
                    partsArray.push({
                        inline_data: { mime_type: "image/jpeg", data: currentImage }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: partsArray }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const replyText = data.candidates[0].content.parts[0].text;
                document.getElementById(aiMsgId).querySelector('.message-bubble').innerHTML = formatOutput(replyText);

            } catch (error) {
                console.error("API Error caught:", error);
                document.getElementById(aiMsgId).querySelector('.message-bubble').innerHTML =
                    "<strong>Notice:</strong> The service is temporarily busy with high traffic. Please wait a moment and click send again.";
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatOutput(text) {
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }
    </script>
</body>

</html>
